<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BabySitter App - Login e Prenotazioni</title>
    <style>
        :root { --primary: #4A90E2; --success: #2ECC71; --bg: #F4F7F9; --card: #FFFFFF; --text: #2C3E50; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: var(--card); padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; }
        input, select, button { width: 100%; padding: 10px; border: 1px solid #CBD5E1; border-radius: 6px; box-sizing: border-box; }
        button.btn { background: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button.btn-logout { background: #E74C3C; width: auto; padding: 6px 12px; float: right; }
        .hidden { display: none; }
        .slot-card { border: 1px solid #E2E8F0; border-left: 5px solid var(--primary); padding: 15px; margin-bottom: 15px; border-radius: 8px; background: #FAFAFA; }
    </style>
</head>
<body>

<div class="container">
    <h1>👶 BabySitter Service Platform</h1>

    <!-- SECTION: AUTHENTICATION -->
    <div id="auth-section" class="card">
        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
            <button class="btn" onclick="toggleAuthMode('login')">Accedi</button>
            <button class="btn" style="background:#64748B" onclick="toggleAuthMode('register')">Registrati</button>
        </div>

        <!-- Form Login -->
        <form id="loginForm">
            <h3>Accedi al tuo account</h3>
            <div class="form-group"><label>Email</label><input type="email" id="loginEmail" required></div>
            <div class="form-group"><label>Password</label><input type="password" id="loginPassword" required></div>
            <button type="submit" class="btn">Accedi</button>
        </form>

        <!-- Form Registrazione -->
        <form id="registerForm" class="hidden">
            <h3>Crea un nuovo account</h3>
            <div class="form-group"><label>Nome Completo</label><input type="text" id="regName" required></div>
            <div class="form-group"><label>Email</label><input type="email" id="regEmail" required></div>
            <div class="form-group"><label>Password</label><input type="password" id="regPassword" required></div>
            <div class="form-group"><label>Telefono</label><input type="tel" id="regPhone" placeholder="+393331234567" required></div>
            <div class="form-group">
                <label>Ruolo Utente</label>
                <select id="regRole">
                    <option value="family">Famiglia (Cerca Babysitter)</option>
                    <option value="sitter">Babysitter (Offri Servizio)</option>
                </select>
            </div>
            <button type="submit" class="btn" style="background:var(--success)">Registrati</button>
        </form>
    </div>

    <!-- SECTION: MAIN DASHBOARD (Visibile solo se loggati) -->
    <div id="dashboard-section" class="hidden">
        <button class="btn btn-logout" onclick="logout()">Logout</button>
        <h2>Benvenuto, <span id="userName"></span> (<span id="userRole"></span>)</h2>

        <!-- Vista Babysitter -->
        <div id="sitter-view" class="card hidden">
            <h3>Pubblica Nuova Disponibilità</h3>
            <form id="addSlotForm">
                <div class="form-group"><label>Data</label><input type="date" id="slotDate" required></div>
                <div class="form-group">
                    <label>Fascia Oraria</label>
                    <select id="timeSlot">
                        <option value="Mattina (08:00 - 13:00)">Mattina (08:00 - 13:00)</option>
                        <option value="Pomeriggio (13:00 - 18:00)">Pomeriggio (13:00 - 18:00)</option>
                        <option value="Sera (18:00 - 23:00)">Sera (18:00 - 23:00)</option>
                    </select>
                </div>
                <div class="form-group"><label>Tariffa Oraria (€)</label><input type="number" step="0.5" id="hourlyRate" value="12.00" required></div>
                <button type="submit" class="btn">Salva Disponibilità</button>
            </form>
        </div>

        <!-- Vista Famiglia -->
        <div id="family-view" class="card hidden">
            <h3>Disponibilità Babysitter</h3>
            <div id="slotsContainer">Caricamento...</div>
        </div>
    </div>
</div>

<script>
    let currentUser = JSON.parse(localStorage.getItem('user')) || null;

    window.onload = () => {
        if (currentUser) showDashboard();
    };

    function toggleAuthMode(mode) {
        document.getElementById('loginForm').classList.toggle('hidden', mode === 'register');
        document.getElementById('registerForm').classList.toggle('hidden', mode === 'login');
    }

    // REGISTRAZIONE
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const body = {
            full_name: document.getElementById('regName').value,
            email: document.getElementById('regEmail').value,
            password: document.getElementById('regPassword').value,
            phone: document.getElementById('regPhone').value,
            role: document.getElementById('regRole').value
        };

        const res = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        const data = await res.json();
        if (data.success) {
            alert('Registrazione completata! Ora effettua il login.');
            toggleAuthMode('login');
        } else alert('Errore: ' + data.error);
    });

    // LOGIN
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                email: document.getElementById('loginEmail').value,
                password: document.getElementById('loginPassword').value
            })
        });
        const data = await res.json();
        if (data.success) {
            currentUser = data.user;
            localStorage.setItem('user', JSON.stringify(currentUser));
            showDashboard();
        } else alert('Login fallito: ' + data.error);
    });

    function logout() {
        localStorage.removeItem('user');
        currentUser = null;
        document.getElementById('auth-section').classList.remove('hidden');
        document.getElementById('dashboard-section').classList.add('hidden');
    }

    function showDashboard() {
        document.getElementById('auth-section').classList.add('hidden');
        document.getElementById('dashboard-section').classList.remove('hidden');
        document.getElementById('userName').innerText = currentUser.full_name;
        document.getElementById('userRole').innerText = currentUser.role;

        if (currentUser.role === 'sitter') {
            document.getElementById('sitter-view').classList.remove('hidden');
            document.getElementById('family-view').classList.add('hidden');
        } else {
            document.getElementById('family-view').classList.remove('hidden');
            document.getElementById('sitter-view').classList.add('hidden');
            caricaSlot();
        }
    }

    // CARICA SLOT PER FAMIGLIE
    async function caricaSlot() {
        const res = await fetch('/api/slots');
        const data = await res.json();
        const container = document.getElementById('slotsContainer');
        if (!data.success || !data.data.length) {
            container.innerHTML = '<p>Nessuna disponibilità aperta.</p>';
            return;
        }
        container.innerHTML = data.data.map(s => `
            <div class="slot-card">
                <h4>${s.users ? s.users.full_name : 'Babysitter'}</h4>
                <p>Data: ${s.slot_date} | Orario: ${s.time_slot} | ${s.hourly_rate}€/ora</p>
                <button class="btn" onclick="prenota('${s.id}', '${s.sitter_id}')">Prenota e Paga Caparra</button>
            </div>
        `).join('');
    }
</script>
</body>
</html>
